<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KING: BATTLE ARENA - Seed Passcode Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h2 {
            color: #58a6ff;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p.subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 14px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #238636;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background: #2ea043;
        }
        .result-box {
            margin-top: 20px;
            background: #0d1117;
            border: 1px dashed #30363d;
            border-radius: 6px;
            padding: 16px;
            text-align: center;
        }
        .result-label {
            font-size: 0.75rem;
            color: #8b949e;
            text-transform: uppercase;
        }
        .passcode {
            font-size: 2.2rem;
            font-weight: bold;
            color: #3fb950;
            letter-spacing: 4px;
            margin: 8px 0;
            font-family: monospace;
        }
        .note {
            font-size: 0.75rem;
            color: #d29922;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>KING: BATTLE ARENA</h2>
    <p class="subtitle">Dynamic Seed Admin Passcode</p>
    
    <div class="input-group">
        <label for="uid">1. UID Player / Admin:</label>
        <input type="number" id="uid" placeholder="Contoh: 1782628457" autocomplete="off">
    </div>

    <div class="input-group">
        <label for="seed">2. Seed Room ID (5-Digit di Game):</label>
        <input type="number" id="seed" placeholder="Contoh: 84920" autocomplete="off">
    </div>

    <button onclick="generateSeedPasscode()">GENERATE PASSCODE</button>

    <div class="result-box" id="resultBox" style="display:none;">
        <div class="result-label">Passcode 6-Digit:</div>
        <div class="passcode" id="passcodeDisplay">------</div>
        <div class="note">Sekali pakai per Seed! Setelah sukses, Seed Room auto-keganti.</div>
    </div>
</div>

<script>
    function generateSeedPasscode() {
        const uidInput = document.getElementById('uid').value;
        const seedInput = document.getElementById('seed').value;

        if (!uidInput || !seedInput) {
            alert('Masukkan UID dan Seed Room terlebih dahulu!');
            return;
        }

        // 1. Ambil 5 angka pertama UID (Sesuai Logika Block Script Craftland)
        const shortUID = parseInt(String(uidInput).substring(0, 5));
        const seedNum = parseInt(seedInput);

        // 2. Formulasi Matematika Berbasis Seed (SAMA PERSIS DENGAN BLOCK CRAFTLAND)
        const partUID = (shortUID * 3137) % 900000;
        const partSeed = (seedNum * 7919) % 900000;

        // 3. Passcode Final 6-Digit (Range 100,000 - 999,999)
        const passcode = ((partUID + partSeed) % 900000) + 100000;

        // Tampilkan Hasil
        document.getElementById('passcodeDisplay').innerText = passcode;
        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
